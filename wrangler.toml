# grow.flisk.si on Cloudflare: paste a link, get a plan to find the first customers. Plans in D1, the model through
# inference.flisk.si (service binding), the AI search check through Citable (service binding).
# Deploy by hand from this folder: bunx wrangler@4 deploy. Secret: INFERENCE_KEY (a key from inference.flisk.si).
name = "flisk-grow"
main = "src/index.js"
compatibility_date = "2026-11-01"

[vars]
LOGIN_PUBLIC_KEY = "g_3cGlqaMDf4mM4Bgfv8EO6js7yW_bcSW7cOUpSwLc0"
# Each plan is three calls on Llama 3.1 8B fast through the AI binding below, about 50 neurons together, so 30 plans
# use about 1,500 of the account's 10,000 free neurons a day. inference.flisk.si is only the fallback.
PLANS_PER_VISITOR = "10"
PLANS_PER_DAY = "30"

[ai]
binding = "AI"

[[services]]
binding = "INFERENCE"
service = "flisk-inference"

[[services]]
binding = "CITABLE"
service = "citable"

# A GitHub repo gets listed on ranker.flisk.si (flisk-sh/ranker): its page and live badge go in the plan.
[[services]]
binding = "RANKER"
service = "flisk-ranker"

# Problems go to traces.flisk.si (flisk-sh/traces). Secret TRACE_KEY is this app's key there (TRACE_KEY_GROW on the traces Worker).
[[services]]
binding = "TRACES"
service = "flisk-traces"

[[d1_databases]]
binding = "DB"
database_name = "flisk-grow"
database_id = "63e62013-1cff-4781-b352-59ff4761325d"

[triggers]
crons = ["17 3 * * *"]

[[routes]]
pattern = "grow.flisk.si"
custom_domain = true

# Sign-in through login.flisk.si (flisk-sh/login): set LOGIN_PUBLIC_KEY to the value login.flisk.si/key shows and
# no GitHub app or secret is needed here. Without it, grow falls back to its own GitHub app (GITHUB_CLIENT_ID/SECRET).
# LOGIN_ORIGIN defaults to https://login.flisk.si.
